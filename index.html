<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Calculator</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
</style>

</head>

<body class="h-screen flex justify-center items-center p-4
bg-gradient-to-br from-[#f6e6ea] via-[#f1e4ff] to-[#e8f0ff]
bg-[length:400%_400%] animate-[bgMove_14s_ease_infinite]">

<div class="w-full max-w-[450px]">

  <div class="relative text-center p-[35px] rounded-[30px]
    bg-[rgba(255,255,255,0.35)]
    border border-[rgba(255,255,255,0.4)]
    shadow-[0_25px_60px_rgba(0,0,0,0.15),inset_0_0_30px_rgba(255,255,255,0.3)]
    overflow-hidden">

   
    <div class="absolute top-[-50%] left-[-50%] w-[200%] h-[200%]
      bg-[radial-gradient(circle,rgba(192,132,151,0.18),transparent_60%)]
      rotate-[25deg]"></div>

    <h2 class="relative z-10 text-[28px] font-semibold text-[#1f2937] mb-[25px]">
      Calculator
    </h2>

    <input type="text" placeholder="First Number"
      class="relative z-10 w-full p-[15px] my-[10px]
      rounded-[14px] border border-[rgba(0,0,0,0.12)]
      bg-[rgba(255,255,255,0.7)] text-center text-[16px] outline-none
      focus:border-[#c08497] focus:shadow-[0_0_12px_rgba(192,132,151,0.25)]">

    <div class="relative z-10 flex justify-center gap-[12px] my-[20px] flex-wrap">

      <button onclick="mycala('+')"
        class="w-[60px] h-[60px] rounded-full text-white text-[22px]
        bg-gradient-to-br from-[#c08497] to-[#a3a1ff]
        shadow-[0_12px_25px_rgba(0,0,0,0.2)]
        transition hover:-translate-y-2 hover:scale-105">
        +
      </button>

      <button onclick="mycala('-')"
        class="w-[60px] h-[60px] rounded-full text-white text-[22px]
        bg-gradient-to-br from-[#c08497] to-[#a3a1ff]
        shadow-[0_12px_25px_rgba(0,0,0,0.2)]
        transition hover:-translate-y-2 hover:scale-105">
        -
      </button>

      <button onclick="mycala('/')"
        class="w-[60px] h-[60px] rounded-full text-white text-[22px]
        bg-gradient-to-br from-[#c08497] to-[#a3a1ff]
        shadow-[0_12px_25px_rgba(0,0,0,0.2)]
        transition hover:-translate-y-2 hover:scale-105">
        /
      </button>

      <button onclick="mycala('*')"
        class="w-[60px] h-[60px] rounded-full text-white text-[22px]
        bg-gradient-to-br from-[#c08497] to-[#a3a1ff]
        shadow-[0_12px_25px_rgba(0,0,0,0.2)]
        transition hover:-translate-y-2 hover:scale-105">
        *
      </button>

    </div>

    <input type="text" placeholder="Second Number"
      class="relative z-10 w-full p-[15px] my-[10px]
      rounded-[14px] border border-[rgba(0,0,0,0.12)]
      bg-[rgba(255,255,255,0.7)] text-center text-[16px] outline-none
      focus:border-[#c08497] focus:shadow-[0_0_12px_rgba(192,132,151,0.25)]">

    <button onclick="sum()"
      class="relative z-10 w-full mt-[15px] p-[15px]
      rounded-[14px] text-white text-[18px] font-bold
      bg-gradient-to-br from-[#b5838d] to-[#8ecae6]
      shadow-[0_15px_30px_rgba(0,0,0,0.2)]
      transition hover:-translate-y-1">

      Calculate
    </button>

    <h1 class="relative z-10 mt-[25px] text-[42px] text-[#111827] min-h-[50px]"></h1>

  </div>

</div>

<script>
const h1 = document.querySelector('h1')
const inp = document.querySelectorAll('input')

function mycala(sing){
  window.sing = sing
}

function sum(){
  let flag = 0
  let num1 = +inp[0].value
  let num2 = +inp[1].value

  inp[0].style.border = ""
  inp[1].style.border = ""

  if(inp[0].value==''){inp[0].style.border='2px solid #c08497';flag++}
  if(inp[1].value==''){inp[1].style.border='2px solid #c08497';flag++}

  if(flag==0){
    if(sing=='+')h1.innerHTML=num1+num2
    else if(sing=='-')h1.innerHTML=num1-num2
    else if(sing=='/')h1.innerHTML=num1/num2
    else h1.innerHTML=num1*num2
  }
}
</script>

</body>
</html>
